<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{width:240px;margin:0;padding:16px;background:#161618;color:#e7e9ea;
    font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:15px;margin:0 0 12px}
  label{display:block;color:#9ba0a5;font-size:12px;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;background:#0f0f10;color:#e7e9ea;
    border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 10px;font-size:14px}
  button{margin-top:12px;width:100%;padding:9px;border:none;border-radius:999px;
    background:#e7e9ea;color:#000;font-weight:600;cursor:pointer}
  #status{margin-top:8px;font-size:12px;color:#71767b;min-height:14px}
</style>
</head>
<body>
  <h1>x-brake</h1>
  <label for="limit">Daily budget per site (minutes)</label>
  <input id="limit" type="number" min="1" max="480" value="30">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
